<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280">

  <!-- BB 鼠 · bongo 版：趴姿。改了轮廓记得重跑脚本，别手改。 -->

  <!-- 1. 合并外轮廓：先把所有形状描一圈粗边… -->
  <g fill="none" stroke="#1A1A1A" stroke-width="7" stroke-linejoin="round">
    <rect x="56" y="110" width="308" height="180" rx="64"/>
    <ellipse cx="210.00" cy="100.00" rx="126.00" ry="65.00"/>
    <circle cx="118.00" cy="46.00" r="29.00"/>
    <circle cx="302.00" cy="42.00" r="24.36"/>
  </g>

  <!-- 2. …再整体填色，把内部的边盖掉，头和身体就长成一体了 -->
  <g fill="#C9C9C9">
    <rect x="56" y="110" width="308" height="180" rx="64"/>
    <ellipse cx="210.00" cy="100.00" rx="126.00" ry="65.00"/>
    <circle cx="118.00" cy="46.00" r="29.00"/>
    <circle cx="302.00" cy="42.00" r="24.36"/>
  </g>

  <!-- 3. 耳朵内侧：远侧那只小一号 -->
  <ellipse cx="118.0" cy="48.0" rx="14" ry="15" fill="#F2A8A8"/>
  <ellipse cx="302.0" cy="44.0" rx="9" ry="9.5" fill="#F2A8A8"/>

  <!-- 4. 尾巴：从身体右后侧甩出去，别贴着键盘边缘横过来 -->
  <path d="M 338 206 C 380 202 398 180 392 156" fill="none" stroke="#1A1A1A" stroke-width="15" stroke-linecap="round"/>
  <path d="M 338 206 C 380 202 398 180 392 156" fill="none" stroke="#F2A8A8" stroke-width="9" stroke-linecap="round"/>

  <!-- 5. 口鼻部：跟着鼻子左移，右半边留得比左半边多才是侧面 -->
  <ellipse cx="203.0" cy="136" rx="33" ry="19" fill="#F7F7F7" stroke="#1A1A1A" stroke-width="3"/>

  <!-- 6. 腮红：远侧更小更靠上 -->
  <ellipse cx="131.0" cy="135" rx="16" ry="9" fill="#F2A8A8" opacity="0.65"/>
  <ellipse cx="273.0" cy="129" rx="12" ry="7.5" fill="#F2A8A8" opacity="0.65"/>

  <!-- 7. 眼睛：近侧略大、远侧略小略高，差太大就看着像画歪了 -->
  <ellipse cx="161.0" cy="103.0" rx="17.5" ry="21.0" fill="#1A1A1A"/>
  <ellipse cx="245.0" cy="100.0" rx="15.4" ry="18.5" fill="#1A1A1A"/>
  <circle cx="166.0" cy="95.0" r="5.0" fill="#FFFFFF"/>
  <circle cx="249.0" cy="93.0" r="4.4" fill="#FFFFFF"/>

  <!-- 8. 鼻头 + 嘴：鼻子偏左，整张脸就跟着偏过去了 -->
  <ellipse cx="203.0" cy="125" rx="7.5" ry="5.5" fill="#1A1A1A"/>
  <path d="M 203.0 131 L 203.0 137 M 203.0 137 C 196.0 144 187.0 144 182.0 139 M 203.0 137 C 210.0 144 219.0 144 224.0 139" fill="none" stroke="#1A1A1A" stroke-width="3.2" stroke-linecap="round"/>

  <!-- 9. 胡须：左边短、右边长，符合侧身的透视；起点贴在口鼻边缘 -->
  <path d="M 172.0 132 L 123.0 124 M 172.0 142 L 121.0 146" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
  <path d="M 234.0 132 L 291.0 122 M 234.0 142 L 295.0 144" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
</svg>