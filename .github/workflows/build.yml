# 一次构建同时产出三个安装包：Windows + macOS Intel + macOS Apple Silicon
# 使用：push 到 main 自动出 Artifacts；打 tag v* 自动发布 Release
#
# 产物：
#   - Peko-Windows.zip          — Windows (x64)
#   - Peko-macOS-Intel.zip      — macOS Intel (x86_64)
#   - Peko-macOS-AppleSilicon.zip — macOS Apple Silicon (arm64)

name: Build Peko (3 平台)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Build
        run: packaging\build.bat
        working-directory: ${{ github.workspace }}

      - name: Package zip
        run: |
          Compress-Archive -Path dist\Peko.exe -DestinationPath dist\Peko-Windows.zip
        working-directory: ${{ github.workspace }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peko-Windows
          path: dist/Peko-Windows.zip

  build-macos-intel:
    name: Build macOS Intel (x86_64)
    runs-on: macos-latest  # 改用 arm64 runner + Rosetta 2 交叉编译；macos-13 Intel runner 极稀缺、长期排队
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies (x86_64 via Rosetta)
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.15
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 python -m pip install -r requirements.txt
          arch -x86_64 python -m pip install pyinstaller Pillow

      - name: Build (cross-compile x86_64 via Rosetta)
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.15
          arch -x86_64 python -m PyInstaller packaging/main.spec
          # 重命名带架构标识
          mv dist/Peko.app dist/Peko-Intel.app
        working-directory: ${{ github.workspace }}

      - name: Sign, verify & archive
        run: |
          set -euo pipefail
          APP="dist/Peko-Intel.app"
          test -d "$APP" || { echo "ERROR: $APP not found"; ls -la dist/; exit 1; }

          file "$APP/Contents/MacOS/Peko"
          file "$APP/Contents/MacOS/Peko" | grep -q "x86_64" \
            || { echo "ERROR: 主二进制不是 x86_64，交叉编译没生效"; exit 1; }

          # spec 里 BUNDLE 已经带 codesign_identity='-'，正常情况整包是签好的。
          # 所以先只校验，通不过才强签：--deep 会打乱嵌套签名的顺序，
          # 对 PyInstaller 这种已签好的 bundle 反而是破坏，不能无条件跑。
          if ! codesign --verify --deep --strict "$APP" 2>/dev/null; then
            echo "整包签名不完整，强制重签 ..."
            codesign --force --deep --sign - "$APP"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP" \
            || { echo "ERROR: 签名校验失败，这个包发出去必然开不了，中断"; exit 1; }

          # ad-hoc + 未公证，spctl 必然 rejected，只留日志不判失败
          spctl -a -vv "$APP" || true

          # 打 zip 时顺带塞入「首次运行.command」和说明，朋友双击脚本即可启动
          bash packaging/make_mac_zip.sh "$APP" "dist/Peko-macOS-Intel.zip"
        working-directory: ${{ github.workspace }}

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peko-macOS-Intel
          path: dist/Peko-macOS-Intel.zip

  build-macos-arm:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-latest  # 最新 macOS runner 是 arm64 (M1+)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "arm64"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          pyinstaller packaging/main.spec
          # 重命名带架构标识
          mv dist/Peko.app dist/Peko-AppleSilicon.app
        working-directory: ${{ github.workspace }}

      - name: Sign, verify & archive
        run: |
          set -euo pipefail
          APP="dist/Peko-AppleSilicon.app"
          test -d "$APP" || { echo "ERROR: $APP not found"; ls -la dist/; exit 1; }

          file "$APP/Contents/MacOS/Peko"
          file "$APP/Contents/MacOS/Peko" | grep -q "arm64" \
            || { echo "ERROR: 主二进制不是 arm64"; exit 1; }

          # 同 Intel job：先校验，不通过才强签，避免 --deep 破坏嵌套签名
          if ! codesign --verify --deep --strict "$APP" 2>/dev/null; then
            echo "整包签名不完整，强制重签 ..."
            codesign --force --deep --sign - "$APP"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP" \
            || { echo "ERROR: 签名校验失败，这个包发出去必然开不了，中断"; exit 1; }

          spctl -a -vv "$APP" || true

          bash packaging/make_mac_zip.sh "$APP" "dist/Peko-macOS-AppleSilicon.zip"
        working-directory: ${{ github.workspace }}

      - name: Upload macOS Apple Silicon artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peko-macOS-AppleSilicon
          path: dist/Peko-macOS-AppleSilicon.zip

  release:
    name: Release (打 tag 时触发)
    needs: [build-windows, build-macos-intel, build-macos-arm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Peko-Windows/Peko-Windows.zip
            artifacts/Peko-macOS-Intel/Peko-macOS-Intel.zip
            artifacts/Peko-macOS-AppleSilicon/Peko-macOS-AppleSilicon.zip
          generate_release_notes: true
          draft: false
          prerelease: false
