# 一次构建同时产出 Windows 与 macOS 可执行程序
# 使用：推送到 GitHub 后到 Actions 页运行，或 push 时自动运行，从 Artifacts 下载两个平台的产物

name: Build Peko (Windows + macOS)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Build
        run: packaging\build.bat
        working-directory: ${{ github.workspace }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peko-Windows
          path: dist/Peko.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: bash packaging/build_mac.sh
        working-directory: ${{ github.workspace }}

      - name: Verify macOS artifact
        run: |
          set -e
          APP="dist/Peko.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: $APP not found"
            ls -la dist/ || true
            exit 1
          fi
          echo "OK: $APP exists"
          BIN="$APP/Contents/MacOS/Peko"
          if [ ! -x "$BIN" ]; then
            echo "ERROR: main binary missing or not executable: $BIN"
            ls -la "$APP/Contents/MacOS/" || true
            exit 1
          fi
          echo "OK: main binary executable"
          # QtWebEngineProcess 是 PyQtWebEngine 内嵌式关键运行时，必须打进 .app
          WEBENGINE=$(find "$APP" -name "QtWebEngineProcess*" | head -1)
          if [ -n "$WEBENGINE" ]; then
            echo "OK: QtWebEngineProcess bundled: $WEBENGINE"
          else
            echo "WARN: QtWebEngineProcess not found in $APP (工作台内嵌页面会无法打开)"
          fi
          ls -la dist/
        working-directory: ${{ github.workspace }}

      - name: Archive macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Peko.app" "dist/Peko-macOS.zip"
          ls -la dist/
        working-directory: ${{ github.workspace }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peko-macOS
          path: dist/Peko-macOS.zip
